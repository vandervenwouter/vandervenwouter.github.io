<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Projects</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 24px;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      max-width: 900px;
      margin: auto;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 220px));
      gap: 20px;
    }
    .app-tile {
      display: flex;
      width: 100%;
      aspect-ratio: 1;
      padding: 24px;
      border-radius: 24px;
      box-sizing: border-box;
      flex-direction: column;
      justify-content: flex-end;
      color: white;
      text-decoration: none;
      background-color: #173f35;
      box-shadow: 0 12px 30px rgb(15 23 42 / 15%);
      transition: transform 160ms, box-shadow 160ms;
    }
    .app-tile:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 36px rgb(15 23 42 / 22%);
    }
    .app-tile svg {
      width: 64px;
      height: 64px;
      flex: none;
      align-self: center;
      margin: auto 0;
      color: #d9ed9b;
    }
    .app-tile h2,
    .app-tile p {
      margin: 0;
    }
    .app-tile p {
      margin-top: 8px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Projects</h1>
    <section class="projects">
      <a class="app-tile" href="https://vandervenwouter.github.io/hike-generator/">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="signpost" aria-hidden="true" class="lucide lucide-signpost">
          <path d="M12 13v8"></path>
          <path d="M12 3v3"></path>
          <path d="M2.354 10.354a1.207 1.207 0 0 1 0-1.708l2.06-2.06A2 2 0 0 1 5.828 6h12.344a2 2 0 0 1 1.414.586l2.06 2.06a1.207 1.207 0 0 1 0 1.708l-2.06 2.06a2 2 0 0 1-1.414.586H5.828a2 2 0 0 1-1.414-.586z"></path>
        </svg>
        <h2>hike-generator</h2>
        <p>Open project →</p>
      </a>
    </section>
  </main>
</body>
</html>
