<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Projects</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 24px;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      max-width: 900px;
      margin: auto;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }
    .app-tile {
      display: flex;
      aspect-ratio: 1;
      padding: 24px;
      border-radius: 24px;
      box-sizing: border-box;
      flex-direction: column;
      justify-content: flex-end;
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 12px 30px rgb(15 23 42 / 15%);
      transition: transform 160ms, box-shadow 160ms;
    }
    .app-tile:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 36px rgb(15 23 42 / 22%);
    }
    .app-tile h2,
    .app-tile p {
      margin: 0;
    }
    .app-tile p {
      margin-top: 8px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Projects</h1>
    <section class="projects">
      <a class="app-tile" href="https://vandervenwouter.github.io/hike-generator/">
        <h2>hike-generator</h2></h2>
        <p>Open project →</p>
      </a>
    </section>
  </main>
</body>
</html>
